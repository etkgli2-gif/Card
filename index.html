    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        :root { 
            --cyan-glow: #00f0ff;
            --blue-glow: #0055ff;
            --bg-dark: #0a0a0c;
            --danger-red: #ff3b30;
            --success-green: #32d74b;

        .the-card .chip { width: 16px; height: 14px; background: #d4af37; position: absolute; left: 12px; top: 25px; border-radius: 2px; border: 1px solid #b8962e; }

        .record-card-glass {

        .text-red { color: var(--danger-red) !important; font-weight: 700; }

<!-- 隱藏拉炮 -->
<button class="poop-btn" onclick="launchPoop()">❄</button>

<script>
    document.documentElement.style.setProperty('--marquee-duration', 跑馬燈速度 + 's');

    setTimeout(() => {
        const intro = document.getElementById('intro-layer');
        if (intro) intro.remove();
    }, 5500);

    function launchPoop() {
        for (let i = 0; i < 30; i++) {
            const poop = document.createElement('div');
            const emojis = ['💩', '❄️', '✨', '💸', '👑'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            poop.className = 'confetti'; poop.innerText = randomEmoji;
            const destX = (Math.random() - 0.5) * window.innerWidth * 1.5;
            const destY = -window.innerHeight - Math.random() * 500;
            const duration = 1.2 + Math.random() * 2;
            poop.style.left = '50%'; poop.style.bottom = '30px';
            poop.style.setProperty('--x', `${destX}px`); poop.style.setProperty('--y', `${destY}px`);
            poop.style.animationDuration = `${duration}s`;
            document.body.appendChild(poop);
            setTimeout(() => poop.remove(), duration * 1000);
        }
    }

    document.getElementById('marquee-content').innerText = 跑馬燈文字;

    // =================================================================
    // ⚙️ 核心邏輯 - 渲染贊助榜 (自動排序並加入特效)
    // =================================================================
    const sponsorListContainer = document.getElementById('sponsor-list');
    
    // 根據贊助金額由大到小自動排序
    const sortedSponsors = [...贊助榜名單].sort((a, b) => b.amount - a.amount);

    sortedSponsors.forEach((sponsor, index) => {
        const tr = document.createElement('tr');
        const rank = index + 1;
        
        let rankBadgeClass = "badge-other";
        let rankContent = rank;

        // 設定名次徽章樣式
        if (rank === 1) {
            rankBadgeClass = "badge-1";
            rankContent = "1";
            tr.className = "no1-row"; // 加上第一名專屬行 class
        } else if (rank === 2) {
            rankBadgeClass = "badge-2";
            rankContent = "2";
        } else if (rank === 3) {
            rankBadgeClass = "badge-3";
            rankContent = "3";
        }

        // 姓名欄位特效處理
        let nameHtml = sponsor.name;
        if (rank === 1) {
            // 第一名霸氣皇冠 + 金流光姓名
            nameHtml = `<span class="no1-name"><span class="crown-icon">👑</span>${sponsor.name}</span>`;
        }

        // 備註欄位第一名高亮
        let noteHtml = sponsor.note || "（無備註留言）";
        if (rank === 1) {
            noteHtml = `<span style="color: #ffe699; font-style: italic;">"${noteHtml}"</span>`;
        } else {
            noteHtml = `<span class="text-gray" style="font-size: 13px;">${noteHtml}</span>`;
        }

        tr.innerHTML = `
            <td><span class="rank-badge ${rankBadgeClass}">${rankContent}</span></td>
            <td>${nameHtml}</td>
            <td class="${rank === 1 ? 'text-green' : 'text-green'}" style="font-family: monospace; font-size: 16px;">$${sponsor.amount}</td>
            <td style="text-align: left; padding-left: 15px;">${noteHtml}</td>
        `;
        sponsorListContainer.appendChild(tr);
    });

    // =================================================================
    // ⚙️ 核心邏輯 - 渲染每日冷氣紀錄表
    // =================================================================
    const listContainer = document.getElementById('record-list');
    const lines = 每日紀錄表.trim().split('\n');
    const myData = []; const balances = [];

    lines.forEach(line => {
        if (!line.trim()) return; 
        const parts = line.trim().split(/\s+/); 
        if (parts.length >= 2) {
            const dateStr = parts[0];
            const moneyStr = parts[1];
            const isUnknown = (moneyStr === '?' || moneyStr === '？' || moneyStr === '');
            const moneyVal = isUnknown ? null : parseInt(moneyStr);
            
            let rechargeVal = 0;
            if (parts.length >= 3 && parts[2].includes('+')) rechargeVal = parseInt(parts[2].replace('+', ''));
            
            myData.push({ date: dateStr, recharge: rechargeVal, isEstimated: false });
            balances.push(moneyVal);
        }
    });

    for (let i = 0; i < balances.length; i++) {
        if (balances[i] === null) {
            let newerIdx = -1, olderIdx = -1;
            for (let j = i - 1; j >= 0; j--) { if (balances[j] !== null) { newerIdx = j; break; } }
            for (let j = i + 1; j < balances.length; j++) { if (balances[j] !== null) { olderIdx = j; break; } }

            if (newerIdx !== -1 && olderIdx !== -1) {
                let diff = balances[olderIdx] - balances[newerIdx];
                let step = diff / (olderIdx - newerIdx);
                balances[i] = Math.round(balances[olderIdx] - (step * (olderIdx - i)));
                myData[i].isEstimated = true;
            } else if (olderIdx !== -1) {
                let oldestIdx = -1;
                for (let j = olderIdx + 1; j < balances.length; j++) { if (balances[j] !== null) { oldestIdx = j; break; } }
                
                if (oldestIdx !== -1) {
                    let diff = balances[oldestIdx] - balances[olderIdx];
                    let step = diff / (oldestIdx - olderIdx);
                    balances[i] = Math.round(balances[olderIdx] - (step * (olderIdx - i)));
                } else {
                    balances[i] = balances[olderIdx];
                }
                myData[i].isEstimated = true;
            } else {
                balances[i] = 0;
            }
        }
    }

    myData.forEach((data, i) => {
        const tr = document.createElement('tr');
        let costHtml = `<span class="text-gray">-</span>`;
        
        if (i < balances.length - 1) {
            const currentBal = balances[i];
            const prevBal = balances[i+1];
            const actualCost = currentBal - (prevBal + data.recharge);
            
            if (data.recharge > 0) {
                costHtml = `<span class="text-green">+${data.recharge} 元</span><br><span class="text-red">${actualCost} 元</span>`;
            } else {
                if (actualCost < 0) {
                    costHtml = `<span class="text-red">${actualCost} 元</span>`;
                } else if (actualCost > 0) {
                    costHtml = `<span class="text-green">+${actualCost} 元</span>`;
                }
            }
        }

        let displayBalance = balances[i];
        if (data.isEstimated) {
            displayBalance = `<span class="estimated-badge">預估</span>${balances[i]}`;
        }

        tr.innerHTML = `
            <td>${data.date}</td>
            <td>${displayBalance}</td>
            <td>${costHtml}</td>
        `;
        listContainer.appendChild(tr);
    });

    if (balances.length > 0) {
        const currentBal = balances[0];
        document.getElementById('latest-balance').innerHTML = `${currentBal}`;
        document.getElementById('update-time').innerText = myData[0].date;

        let percentage = Math.min(Math.max((currentBal / 血條滿格金額) * 100, 0), 100);
        setTimeout(() => { document.getElementById('hp-fill').style.width = percentage + '%'; }, 4800);

        if (currentBal < 100) {
            document.getElementById('main-header').classList.add('danger-mode');
            document.getElementById('warning-msg').style.display = 'block';
        }
    }
</script>

</body>
</html>
